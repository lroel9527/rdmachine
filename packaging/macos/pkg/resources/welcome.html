<h2>RDMachine：两台 Mac 之间的远程桌面</h2>
<p>下一步可以选择要装的部分：</p>
<ul>
<li><b>RDMachine Server（被控端）</b>：装在要被连接的 Mac 上。会作为服务运行：开机就能连，登录窗口和锁屏时也能连，有人登录或退出时会话跟着换到新的桌面。</li>
<li><b>RDMachine（客户端）</b>：装在用来连接别人的 Mac 上。</li>
</ul>
<p>两台都要装同一个版本。安装服务端时，这台 Mac 上已经在运行的 RDMachine Server 会重启一次，正在进行的连接会断开，重新连上即可。</p>
