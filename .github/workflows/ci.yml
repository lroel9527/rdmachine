name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    # The protocol core has no platform code; test it with sanitizers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build (ASan + UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRDM_WITH_RDACCEL=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    # Universal (arm64 + x86_64) so the same binaries run on Intel and Apple
    # Silicon. Built and run on both kinds of runner: the Intel one also runs
    # the x86_64 slice natively, and keeps CI going while arm64 runners are
    # short on capacity.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check binaries
        run: |
          for b in rdmachine-server rdmachine-client; do
            lipo -info build/bin/$b
            lipo build/bin/$b -verify_arch arm64 x86_64
            ./build/bin/$b
          done
