name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    # The protocol core has no platform code; test it with sanitizers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build (ASan + UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRDM_WITH_RDACCEL=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
