name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    # Everything but the AppKit window builds on Linux: the protocol core,
    # and the session library, server and test client on rdaccel's Linux
    # backends. The end-to-end tests capture an Xvfb screen.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config xvfb \
            libavcodec-dev libavutil-dev libswscale-dev libx265-dev \
            libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxtst-dev zlib1g-dev libpam0g-dev
      - name: Build (ASan + UBSan)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          cmake --build build
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp
        run: xvfb-run -a -s "-screen 0 1280x800x24" ctest --test-dir build --output-on-failure
      - name: Smoke test the binaries
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp
        run: xvfb-run -a -s "-screen 0 1280x800x24" tools/smoke_test.sh build/bin

  core-tsan:
    # The control server is multi-threaded; check the core for data races.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRDM_WITH_RDACCEL=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread" -DCMAKE_C_FLAGS="-fsanitize=thread"
          cmake --build build -j4
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  macos:
    # Universal (arm64 + x86_64) so the same binaries run on Intel and Apple
    # Silicon. macos-latest is arm64; the x86_64 slice runs under Rosetta
    # when the runner has it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check binaries
        run: |
          sw_vers
          for b in rdmachine-server rdmachine-client rdmachine-connect; do
            lipo -info build/bin/$b
            lipo build/bin/$b -verify_arch arm64 x86_64
            ./build/bin/$b --version
            if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 ./build/bin/$b --version; fi
          done
      # Packaging as on a developer Mac: a self-signed certificate made by
      # create-signing-identity.sh, here in a throwaway keychain so nothing
      # waits for a password dialog.
      - name: Package and sign
        run: |
          security create-keychain -p ci rdm-ci.keychain
          kc=$(security list-keychains -d user | tr -d ' "' | grep rdm-ci)
          security set-keychain-settings "$kc"
          security unlock-keychain -p ci "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          packaging/macos/create-signing-identity.sh --keychain "$kc" --trust admin
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" >/dev/null
          packaging/macos/package.sh --keychain "$kc" --zip
          # The second run must find the certificate and leave it alone.
          packaging/macos/create-signing-identity.sh --keychain "$kc" --trust admin
          "dist/RDMachine Server.app/Contents/MacOS/rdmachine-server" --version
          dist/RDMachine.app/Contents/MacOS/rdmachine-client --version
          dist/rdmachine-server.sh --version
          codesign -d -r- "dist/RDMachine Server.app" 2>&1 | grep 'identifier "org.rdmachine.server" and certificate'
      - uses: actions/upload-artifact@v4
        with:
          name: rdmachine-macos
          path: dist/*.zip
