name: macos

# The macOS build is run by hand for now: hosted macOS runners are short on
# capacity and held up PRs, so PR CI is Linux-only until phase 1 wraps up
# (decided 2026-11-06). Run it from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

jobs:
  macos:
    # Universal (arm64 + x86_64) so the same binaries run on Intel and Apple
    # Silicon. Built and run on both kinds of runner: the Intel one also runs
    # the x86_64 slice natively, and keeps CI going while arm64 runners are
    # short on capacity.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check binaries
        run: |
          for b in rdmachine-server rdmachine-client rdmachine-connect; do
            lipo -info build/bin/$b
            lipo build/bin/$b -verify_arch arm64 x86_64
            ./build/bin/$b --version
          done
      # Packaging as on a developer Mac: a self-signed certificate made by
      # create-signing-identity.sh, here in a throwaway keychain so nothing
      # waits for a password dialog.
      - name: Package and sign
        run: |
          security create-keychain -p ci rdm-ci.keychain
          kc=$(security list-keychains -d user | tr -d ' "' | grep rdm-ci)
          security set-keychain-settings "$kc"
          security unlock-keychain -p ci "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          packaging/macos/create-signing-identity.sh --keychain "$kc" --trust admin
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" >/dev/null
          packaging/macos/package.sh --keychain "$kc" --zip
          # The second run must find the certificate and leave it alone.
          packaging/macos/create-signing-identity.sh --keychain "$kc" --trust admin
          "dist/RDMachine Server.app/Contents/MacOS/rdmachine-server" --version
          dist/RDMachine.app/Contents/MacOS/rdmachine-client --version
          dist/rdmachine-server.sh --version
          codesign -d -r- "dist/RDMachine Server.app" 2>&1 | grep -q 'identifier "org.rdmachine.server" and certificate'
      - uses: actions/upload-artifact@v4
        with:
          name: rdmachine-macos-${{ matrix.runner }}
          path: dist/*.zip
